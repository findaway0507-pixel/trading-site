<style>
:root{
  --bg:#f5fafd; --bg2:#fbf8f2; --panel:#ffffff; --panel2:#f6faff; --line:#e9dfcf;
  --tx:#22303f; --tx2:#6e604e; --tx3:#a3957f;
  --gold:#2286d8; --gold2:#43a8e6; --gold-d:#1e77cc; --soft:rgba(44,143,232,.14);
  --s1:#2286d8; --s2:#6fd0e8; --s3:#e05a4a; --s4:#9b6fc4;
  --up:#dd3f36; --down:#0f9a56;
  --ink:#1b2a3a;                      /* 卡通描边色 */
  --k1:#43a8e6; --k2:#6fd0e8; --k3:#6fd0e8; --k4:#38c3f0; --k5:#38c3f0; --k6:#7fa8ff;
  --sh:0 6px 22px rgba(30,60,100,.10);
  --ease:cubic-bezier(.22,.61,.36,1); --dur:.15s;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);overflow:hidden;
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
  "Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.si{width:15px;height:15px;fill:none;stroke-width:1.9;stroke-linecap:round;
  stroke-linejoin:round;flex:0 0 auto}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#ded2bd;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#6fd0e8}
::-webkit-scrollbar-track{background:transparent}

/* ---------------- 解锁页（卡通鲜艳版）---------------- */
#gate{position:fixed;inset:0;z-index:60;overflow:auto;padding:26px 20px;
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(560px 420px at 12% 14%,#d8f0f8 0%,rgba(255,224,138,0) 62%),
    radial-gradient(620px 460px at 88% 8%,#d8f0f8 0%,rgba(255,179,179,0) 62%),
    radial-gradient(680px 520px at 78% 94%,#a9e4ff 0%,rgba(169,228,255,0) 62%),
    radial-gradient(520px 420px at 16% 92%,#b8f5d8 0%,rgba(184,245,216,0) 62%),
    linear-gradient(160deg,#fff8e7,#fff1f4 46%,#eef8ff)}
#gate.hide{display:none}

/* 页面四角的卡通小装饰 */
.doodle{position:absolute;z-index:0;pointer-events:none}
.doodle.f{border-radius:50%}
.doodle.o{border-radius:50%;border:4px solid var(--ink);background:transparent;opacity:.4}
.doodle.s{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,
  21% 91%,32% 57%,2% 35%,39% 35%)}
.d1{width:72px;height:72px;left:6%;top:12%;background:var(--k3);opacity:.85;
  animation:fl 6s ease-in-out infinite alternate}
.d2{width:40px;height:40px;left:13%;bottom:16%;background:var(--k4);opacity:.8;
  animation:fl 5s ease-in-out infinite alternate-reverse}
.d3{width:66px;height:66px;left:87%;top:15%;animation:fl 7s ease-in-out infinite alternate}
.d4{width:48px;height:48px;left:84%;bottom:20%;background:var(--k1);opacity:.75;
  animation:fl 5.4s ease-in-out infinite alternate-reverse}
.d5{width:34px;height:34px;left:28%;top:7%;background:var(--k6);opacity:.8;
  animation:fl 8s ease-in-out infinite alternate}
.d6{width:44px;height:44px;left:72%;bottom:9%;animation:fl 6.6s ease-in-out infinite alternate-reverse}
@keyframes fl{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-16px) rotate(10deg)}}

.card{position:relative;z-index:1;width:100%;max-width:442px;
  background:#fdfeff;border:3px solid var(--ink);border-radius:30px;
  padding:24px 26px 24px;
  box-shadow:9px 11px 0 var(--k3),0 26px 50px rgba(30,60,100,.13)}
.hero{position:relative;height:174px;margin:0 0 20px;border-radius:22px;
  border:3px solid var(--ink);overflow:hidden;
  background:linear-gradient(180deg,#9fe0ff,#d7f2ff 56%,#d8f0f8)}
.hero .sun{position:absolute;top:16px;right:128px;width:40px;height:40px;border-radius:50%;
  background:radial-gradient(circle at 34% 32%,#ecf8ff,#6fd0e8);
  border:3px solid var(--ink);animation:sunspin 16s linear infinite}
@keyframes sunspin{to{transform:rotate(360deg)}}
.hero .rocket{position:absolute;right:10px;top:6px;width:108px;height:100px;
  animation:bob 2.6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-8px) rotate(3deg)}}
.hero .bars{position:absolute;left:0;right:0;bottom:0;height:66%;display:flex;
  align-items:flex-end;justify-content:flex-start;gap:6px;padding:0 104px 0 12px}
.hero i{display:block;width:12px;border-radius:8px;border:3px solid var(--ink);
  box-shadow:2px 3px 0 rgba(27,42,58,.16);
  animation:pop .5s cubic-bezier(.2,.8,.3,1.25) backwards}
@keyframes pop{from{transform:translateY(16px) scaleY(.2);opacity:0}to{transform:none;opacity:1}}
.hero .tag{position:absolute;left:14px;top:12px;font-size:11px;font-weight:850;
  letter-spacing:.1em;color:#124b84;background:#fff;border:2.5px solid var(--ink);
  border-radius:999px;padding:3px 10px;text-transform:uppercase;
  box-shadow:2px 2px 0 rgba(27,42,58,.2)}

.brandrow{display:flex;align-items:center;gap:13px;margin-bottom:6px}
.mark{width:50px;height:50px;border-radius:16px;flex:0 0 50px;
  background:linear-gradient(140deg,var(--k2),var(--k1));
  border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;
  box-shadow:3px 4px 0 rgba(27,42,58,.25)}
.mark svg{width:26px;height:26px;stroke:#fff;stroke-width:2.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(1px 1px 0 rgba(27,42,58,.4))}
.card h1{margin:0;font-size:23px;font-weight:850;letter-spacing:.4px}
.card h1 .hi{background:linear-gradient(180deg,transparent 60%,#d8f0f8 60%);
  border-radius:4px;padding:0 3px}
.card .sub{margin:5px 0 0;font-size:12px;color:#7a93ab;font-weight:650}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0 2px}
.chip2{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:750;
  color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:5px 11px;
  background:#fff;box-shadow:2px 2px 0 rgba(27,42,58,.18)}
.chip2 svg{width:13px;height:13px;stroke:var(--ink);stroke-width:2.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.chip2.a{background:#eff7ff}.chip2.b{background:#eff7ff}.chip2.c{background:#fbfdff}
.field{display:flex;gap:9px;margin-top:18px}
.field input{flex:1;min-width:0;padding:14px 15px;border-radius:16px;
  border:3px solid var(--ink);background:#fffdf5;color:var(--tx);outline:none;
  font-weight:650;transition:box-shadow .16s var(--ease),background .16s var(--ease)}
.field input::placeholder{color:#9bb3c9;font-weight:600}
.field input:focus{background:#fff;box-shadow:0 0 0 4px rgba(56,195,240,.55)}
.btn-primary{padding:14px 22px;border-radius:16px;min-width:98px;font-size:15px;
  border:3px solid var(--ink);background:linear-gradient(140deg,#6fd0e8,var(--k1));
  color:#3a1f00;font-weight:850;letter-spacing:.4px;
  box-shadow:4px 5px 0 var(--ink);
  transition:transform .12s var(--ease),box-shadow .12s var(--ease),filter .16s var(--ease)}
.btn-primary:hover{filter:brightness(1.04);transform:translate(-1px,-1px);
  box-shadow:6px 7px 0 var(--ink)}
.btn-primary:active{transform:translate(4px,5px);box-shadow:1px 1px 0 var(--ink)}
.btn-primary.busy{opacity:.75;pointer-events:none}
.err{min-height:17px;margin-top:11px;font-size:12.5px;font-weight:750;color:#d63a2f}
.hint{margin-top:10px;font-size:11.5px;color:#7a93ab;font-weight:650;line-height:1.75;
  display:flex;align-items:center;gap:7px}
@media (prefers-reduced-motion:reduce){
  .hero i,.hero .rocket,.hero .sun,.doodle{animation:none !important}
}

/* ---------------- 主布局 ---------------- */
#app{display:none;flex-direction:column;height:100%}
#app.show{display:flex}
.main-col{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
.top{display:flex;align-items:center;gap:11px;height:56px;padding:0 14px;
  background:rgba(255,255,255,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);z-index:20}
.icon{width:35px;height:35px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;border:1px solid var(--line);background:#fff;
  transition:background .15s var(--ease),border-color .15s var(--ease)}
.icon:hover{background:var(--panel2);border-color:#ddd0ba}
.icon svg{width:16px;height:16px;stroke:var(--tx);stroke-width:2;fill:none;
  stroke-linecap:round}
.titles{min-width:0;flex:1}
.t1{font-size:13.5px;font-weight:750;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
.t2{font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:1px}
.dot{width:8px;height:8px;border-radius:50%;background:#d9cdb8;flex:0 0 8px;
  transition:background .3s var(--ease),box-shadow .3s var(--ease)}
.dot.on{background:var(--down);box-shadow:0 0 0 3px rgba(15,154,86,.16)}
.ghost{padding:7px 13px;border-radius:10px;border:1px solid var(--line);
  background:#fff;font-size:12.5px;transition:background .15s var(--ease);
  display:flex;align-items:center;gap:6px}
.ghost:hover{background:var(--panel2)}

/* 同日报告切换条 */
.tabs{display:flex;gap:8px;padding:11px 14px;overflow-x:auto;
  border-bottom:1px solid var(--line);background:#fdfeff;scrollbar-width:none;
  scroll-behavior:smooth}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 14px;
  border-radius:999px;font-size:12.5px;color:var(--tx2);border:1px solid var(--line);
  background:#fff;white-space:nowrap;
  transition:color .18s var(--ease),border-color .18s var(--ease),
    background .18s var(--ease),box-shadow .18s var(--ease),transform .12s var(--ease)}
.tab:hover{color:var(--tx);border-color:#ddd0ba;transform:translateY(-1px)}
.tab .hm{font-size:10.5px;color:var(--tx3);font-variant-numeric:tabular-nums}
.tab.on{color:#08243f;font-weight:750;border-color:transparent;
  background:linear-gradient(140deg,var(--gold2),#6fd0e8);
  box-shadow:0 4px 14px rgba(44,143,232,.30)}
.tab.on .si{stroke:#08243f !important}
.tab.on .hm{color:rgba(61,42,9,.72)}

/* 报告区：两个 iframe 交叉淡入，切换不再白屏抖动 */
.stage{flex:1;min-height:0;position:relative;background:var(--bg)}
.view{position:absolute;inset:0;width:100%;height:100%;border:0;
  background:#fbfdff;opacity:0;pointer-events:none;z-index:1;
  transform:translateY(6px) scale(.996);
  transition:opacity var(--dur) var(--ease),transform .3s var(--ease)}
.view.on{opacity:1;pointer-events:auto;z-index:2}

/* 还没有任何报告时的空状态（照样能解锁进来，只是没内容） */
#empty{position:absolute;inset:0;z-index:3;display:none;padding:26px;
  align-items:center;justify-content:center;background:var(--bg)}
#empty.show{display:flex}
.emptycard{width:100%;max-width:420px;text-align:center;background:#fdfeff;
  border:3px solid var(--ink);border-radius:24px;padding:28px 26px 24px;
  box-shadow:8px 9px 0 var(--k3)}
.emptycard .big{font-size:44px;line-height:1;margin-bottom:12px}
.emptycard h2{margin:0 0 8px;font-size:18px;font-weight:850;border:0;padding:0}
.emptycard p{margin:0;color:#7a93ab;font-size:13px;font-weight:650;line-height:1.8}
.emptycard .tags{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:16px}
.emptycard .tag2{font-size:11.5px;font-weight:750;border:2.5px solid var(--ink);
  border-radius:999px;padding:5px 11px;background:#eff7ff;box-shadow:2px 2px 0 rgba(27,42,58,.18)}

/* ---------------- 目录（桌面侧栏 / 手机抽屉）---------------- */
#side{background:#fdfeff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;z-index:40}
.side-h{display:flex;align-items:center;gap:8px;height:56px;padding:0 16px;
  border-bottom:1px solid var(--line);font-size:13px;font-weight:750;flex:0 0 auto;
  color:var(--tx)}
.side-h .cnt{margin-left:auto;font-size:11px;color:var(--tx3);font-weight:400;
  background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:2px 8px}
#nav{flex:1;overflow-y:auto;padding:10px 10px 26px}
.day{margin-bottom:8px}
.day-h{width:100%;display:flex;align-items:center;gap:9px;padding:10px 11px;
  border-radius:11px;color:var(--tx2);transition:background .15s var(--ease)}
.day-h:hover{background:var(--panel2)}
.day-h .cal{width:26px;height:26px;border-radius:8px;flex:0 0 26px;
  background:#fff;border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center}
.day-h .cal svg{width:14px;height:14px;stroke:var(--gold-d);stroke-width:1.9;fill:none}
.day-h .d{font-size:12.5px;font-weight:750;color:var(--tx);
  font-variant-numeric:tabular-nums}
.day-h .w{font-size:10.5px;color:var(--tx3)}
.day-h .n{margin-left:auto;font-size:10.5px;color:var(--tx3)}
.day-h .cv{width:8px;height:8px;border-right:1.8px solid var(--tx3);
  border-bottom:1.8px solid var(--tx3);transform:rotate(45deg);
  transition:transform .2s var(--ease);margin-top:-3px}
.day.collapsed .day-h .cv{transform:rotate(-45deg);margin-top:2px}
.day-b{padding:1px 0 5px 10px;display:block}
.day.collapsed .day-b{display:none}
.item{width:100%;display:flex;align-items:center;gap:9px;padding:9px 11px;
  border-radius:10px;color:var(--tx2);font-size:12.8px;transition:.16s var(--ease);
  text-align:left;border:1px solid transparent}
.item:hover{background:var(--panel2);color:var(--tx)}
.item .chip{width:24px;height:24px;border-radius:7px;flex:0 0 24px;
  display:flex;align-items:center;justify-content:center;background:#fff;
  border:1px solid var(--line)}
.item.on{background:linear-gradient(140deg,#eaf4ff,#fff8ec);
  border-color:#d8f0f8;color:#08243f;font-weight:750}
.item .hm{margin-left:auto;font-size:10.5px;color:var(--tx3);
  font-variant-numeric:tabular-nums}

#scrim{position:fixed;inset:0;background:rgba(60,44,24,.38);backdrop-filter:blur(2px);
  z-index:35;opacity:0;pointer-events:none;
  transition:opacity .24s var(--ease)}

/* ---------------- 手机端 ---------------- */
@media (max-width:899px){
  .stage{background:#f5fafd}
  /* 手机上一切可点元素 ≥44px（design.md §1.3 tapTargetMin） */
  .top{height:52px;padding:0 10px}
  .t2{display:none}
  .icon{width:40px;height:40px}
  .ghost{min-height:40px}
  .tabs{padding:8px 10px;gap:6px;position:sticky;top:52px;z-index:15}
  .tab{min-height:40px;padding:9px 13px}
  .item{min-height:46px;padding:12px 12px}
  .day-h{min-height:46px;padding:11px 11px}
  .side-h{min-height:56px}
  #side{position:fixed;left:0;right:0;bottom:0;max-height:78vh;
    border-radius:22px 22px 0 0;border-right:0;border-top:1px solid var(--line);
    transform:translate3d(0,101%,0);
    transition:transform .3s cubic-bezier(.32,.72,0,1);
    box-shadow:0 -14px 44px rgba(96,70,30,.22);will-change:transform;
    padding-bottom:env(safe-area-inset-bottom,0)}
  #side.open{transform:translate3d(0,0,0)}
  #scrim.show{opacity:1;pointer-events:auto}
  .side-h{border-radius:22px 22px 0 0;position:relative;height:58px;padding-top:12px}
  .side-h::before{content:"";position:absolute;top:8px;left:50%;
    transform:translateX(-50%);width:40px;height:4px;border-radius:2px;background:#dbe8f5}
  .item{padding:12px 12px}
  .tab{padding:9px 15px}
}

/* ---------------- 桌面端 ---------------- */
@media (min-width:900px){
  #app.show{display:grid;grid-template-columns:300px 1fr;
    grid-template-rows:1fr;height:100%}
  #side{grid-row:1;grid-column:1}
  .main-col{grid-row:1;grid-column:2}
  .stage{padding:14px}
  .view{border-radius:16px;box-shadow:var(--sh);border:1px solid #e6eff8}
  #scrim{display:none}
  #menuBtn{display:none}
}

      <span class="chip2 a"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>AES-256</span>
      <span class="chip2 b"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6z"/></svg>服务器只有密文</span>
      <span class="chip2 c"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.2l3 1.8"/></svg>每日自动更新</span>
    </div>
    <div class="field">
      <input id="pw" type="password" placeholder="访问口令" autocomplete="current-password">
      <button class="btn-primary" id="go" type="submit">解锁</button>
    </div>
    <div class="err" id="err"></div>
    <div class="hint"><svg class="si" viewBox="0 0 24 24" style="stroke:var(--tx3)">
      <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
      </svg>今天已登录过就不用再输；跨零点后首次访问需重新输入</div>
  </form>
</div>

<div id="app">
  <aside id="side">
    <div class="side-h"><svg class="si" viewBox="0 0 24 24" style="stroke:var(--gold-d)">
      <rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>
      </svg>报告目录<span class="cnt" id="cnt"></span></div>
    <nav id="nav"></nav>
  </aside>

  <div class="main-col">
    <header class="top">
      <button class="icon" id="menuBtn" onclick="toggleSide()" aria-label="目录">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="titles">
        <div class="t1" id="curTitle">—</div>
        <div class="t2" id="curSub">—</div>
      </div>
      <span class="dot" id="dot"></span>
      <button class="ghost" onclick="doLock()">
        <svg class="si" viewBox="0 0 24 24" style="stroke:var(--tx2)">
          <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>锁定</button>
    </header>
    <div class="tabs" id="tabs"></div>
    <div class="stage">
      <iframe id="viewA" class="view" sandbox="" referrerpolicy="no-referrer"></iframe>
      <iframe id="viewB" class="view" sandbox="" referrerpolicy="no-referrer"></iframe>
      <div id="empty">
        <div class="emptycard">
          <div class="big">🗂️</div>
          <h2>暂时还没有报告</h2>
          <p>报告每天自动生成：<br>盘前 09:28 · 盘前二 09:45 · 盘中 12:30 · 盘后 20:00。<br>
             有了新报告，这里会自动出现，左侧目录里也能翻到。</p>
          <div class="tags">
            <span class="tag2">口令已验证 ✓</span>
            <span class="tag2">历史报告不会被删除</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="scrim" onclick="toggleSide(false)"></div>

<script>
const $=s=>document.querySelector(s);
const b64=d=>Uint8Array.from(atob(d),c=>c.charCodeAt(0));
const WEEK=["周日","周一","周二","周三","周四","周五","周六"];
const SUN="<path d='M12 3.5v2.6'/><path d='M4.9 9.9 3.3 8.3'/><path d='M2.5 17.5h19'/><path d='M5.8 13.8a6.6 6.6 0 0 1 12.4 0'/>";
const SLOTS={
  "盘前一":{"hm":"09:28","c":"var(--s1)","p":SUN},
  "盘前":{"hm":"09:28","c":"var(--s1)","p":SUN},
  "盘前二":{"hm":"09:45","c":"var(--s2)","p":"<circle cx='12' cy='12' r='4.1'/><path d='M12 2.4v2.4M12 19.2v2.4M4.4 12H2M22 12h-2.4M6 6l1.7 1.7M16.3 16.3 18 18M18 6l-1.7 1.7M7.7 16.3 6 18'/>"},
  "盘中":{"hm":"12:30","c":"var(--s3)","p":"<path d='M4 20V10M10 20V4M16 20v-7M22 20H2'/>"},
  "盘后":{"hm":"20:00","c":"var(--s4)","p":"<path d='M20.5 14.3A8.5 8.5 0 1 1 9.7 3.5a7 7 0 0 0 10.8 10.8z'/>"}
};
const DEFS={"hm":"","c":"var(--tx3)","p":"<path d='M5 4h11l3 3v13H5z'/><path d='M9 9h6M9 13h6'/>"};
function slot(s){return SLOTS[s]||DEFS}
function si(s,px){const d=slot(s);px=px||15;
  return '<svg class="si" viewBox="0 0 24 24" style="stroke:'+d.c+';width:'+px
    +'px;height:'+px+'px">'+d.p+'</svg>'}
const VIEWS=[$("#viewA"),$("#viewB")];
let KEY=null,ITEMS=null,CUR=null,ACTIVE=0,LASTDAY=null;
const CACHE=new Map();          // fid → 已解密的正文（只在内存里）

function store(k,v){try{if(v===undefined)return sessionStorage.getItem(k);
  sessionStorage.setItem(k,v)}catch(e){}return null}
/* 当日免密：登录成功后把口令记一天（跨零点自动失效）。
   注意：这是"方便"不是"更安全"——口令会以 base64 存在本机浏览器里（仅当日），
   所以「锁定」会把它清掉；共用电脑上别用这招。 */
const DAYKEY="_pd";
function today(){const d=new Date();return d.getFullYear()+"-"
  +String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function savedPw(){
  try{const raw=localStorage.getItem(DAYKEY);
    if(raw){const o=JSON.parse(raw);if(o&&o.d===today()&&o.k)return atob(o.k)}}catch(e){}
  return store("_p")||"";
}
function savePw(pw){
  try{localStorage.setItem(DAYKEY,JSON.stringify({d:today(),k:btoa(pw)}))}catch(e){}
  try{sessionStorage.removeItem("_p")}catch(e){}
}
function forgetPw(){
  try{localStorage.removeItem(DAYKEY)}catch(e){}
  try{sessionStorage.removeItem("_p")}catch(e){}
}
function wk(d){try{return WEEK[new Date(d+"T00:00:00").getDay()]}catch(e){return""}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function paintHero(){
  const el=$("#hero");if(!el)return;
  const cols=["#43a8e6","#6fd0e8","#38c3f0","#38c3f0","#7fa8ff"];
  let h="",seed=7;
  for(let i=0;i<14;i++){
    seed=(seed*97+13)%100;
    const hh=34+i*5+seed*0.2;          // 整体向上走，带一点随机
    h+='<i style="height:'+hh.toFixed(0)+'px;background:'+cols[i%cols.length]
      +';animation-delay:'+(i*30)+'ms"></i>';
  }
  el.innerHTML=h;
}

async function deriveKey(pw,salt,iter){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),
    "PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function doUnlock(){
  const pw=$("#pw").value.trim();
  if(!pw)return;
  $("#err").textContent="";
  const go=$("#go");go.classList.add("busy");go.textContent="解锁中";
  try{
    if(!ITEMS){
      /* 清单已内联在页面里（构建时写入 window.MF）：这样"报告列表"和"报告正文"
         永远来自同一次构建，不会再被 CDN 缓存成新旧两份。
         取不到内联值时（例如老版本外壳或手改的页面）再退回网络取。 */
      const m=window.MF||await (await fetch("data/manifest.json",{cache:"no-store"})).json();
      const k=await deriveKey(pw,b64(m.salt),m.iter);
      const pt=await crypto.subtle.decrypt(
        {name:"AES-GCM",iv:b64(m.iv),additionalData:new TextEncoder().encode("manifest")},
        k,b64(m.ct));
      ITEMS=JSON.parse(new TextDecoder().decode(pt)).items||[];
      KEY=k;
    }
    $("#gate").classList.add("hide");
    $("#app").classList.add("show");
    $("#dot").classList.add("on");
    buildNav();refreshTabs();
    if(ITEMS.length){await openItem(ITEMS[0].f,true);}
    else{renderEmptyHead();showEmpty(true);}
    savePw(pw);                                   // 记一天，明天首次访问再输
    preload();                                    // 后台把报告解密好，切换才丝滑
  }catch(e){
    ITEMS=null;KEY=null;
    forgetPw();                                  // 口令错了就别留着
    $("#err").textContent="口令错误，请重新输入。";
  }finally{go.classList.remove("busy");go.textContent="解锁";}
}
function curView(){return VIEWS[ACTIVE]}
function altView(){return VIEWS[1-ACTIVE]}
function setDocSync(html){const v=curView();if(!v)return;v.classList.add("on");v.srcdoc=html;}
function showEmpty(on){
  $("#empty").classList.toggle("show",!!on);
  if(on)VIEWS.forEach(v=>{v.classList.remove("on");v.srcdoc="";});
}
function renderEmptyHead(){
  $("#curTitle").textContent="暂无报告";
  $("#curSub").textContent="每天盘前 / 盘中 / 盘后自动生成后出现在这里";
  document.title="交易报告";
  $("#tabs").innerHTML="";LASTDAY=null;
}
async function docOf(fid){
  if(CACHE.has(fid))return CACHE.get(fid);
  const d=await (await fetch("data/"+fid+".json",{cache:"no-store"})).json();
  const pt=await crypto.subtle.decrypt(
    {name:"AES-GCM",iv:b64(d.iv),additionalData:new TextEncoder().encode(fid)},
    KEY,b64(d.ct));
  const html=new TextDecoder().decode(pt);
  CACHE.set(fid,html);
  return html;
}
async function warm(fid){
  if(!fid||!KEY||CACHE.has(fid))return;
  try{await docOf(fid)}catch(e){}
}
function preload(){                     // 登录后在空闲时把报告全部解密好
  const idle=window.requestIdleCallback||(f=>setTimeout(f,100));
  (ITEMS||[]).forEach(it=>idle(()=>warm(it.f),{timeout:1000}));
}
function markPending(fid,on){
  const el=$("#nav").querySelector('.item[data-f="'+fid+'"]');
  if(el)el.classList.toggle('pending',!!on);
}
async function openItem(fid,instant){
  if(!fid||fid===CUR)return;
  showEmpty(false);
  markPending(fid,true);                 // 立刻反馈，不让点击"石沉大海"
  const cached=CACHE.has(fid);
  const html=await docOf(fid);
  const from=curView(),to=altView();
  await new Promise(res=>{
    let done=false;const fin=()=>{if(!done){done=true;res()}};
    to.onload=fin;to.srcdoc=html;setTimeout(fin,cached?250:1200);   // 兜底，别把界面卡住
  });
  to.classList.add("on");
  from.classList.remove("on");
  if(!instant)setTimeout(()=>{if(!from.classList.contains("on"))from.srcdoc="";},150);
  else from.srcdoc="";
  ACTIVE=1-ACTIVE;CUR=fid;
  markPending(fid,false);
  refreshTabs();markActive();renderHead();
  if(innerWidth<900)toggleSide(false);
}
function cur(){return (ITEMS||[]).find(i=>i.f===CUR)||null}
function renderHead(){
  const c=cur(); if(!c){renderEmptyHead();return}
  $("#curTitle").innerHTML=si(c.s,16)+"<span>"+esc(c.s)+"报告</span>";
  const m=slot(c.s).hm;
  $("#curSub").textContent=c.d+" "+wk(c.d)+(m?" · 生成 "+m:"");
  document.title=(c.d+" "+c.s+" · 交易报告");
}
function byDate(){
  const m={};
  (ITEMS||[]).forEach(i=>{(m[i.d]=m[i.d]||[]).push(i)});
  const days=Object.keys(m).sort().reverse();
  days.forEach(d=>m[d].sort((a,b)=>(a.o||0)-(b.o||0)));
  return days.map(d=>[d,m[d]]);
}
function buildNav(){
  const days=byDate();
  $("#cnt").textContent=days.length+" 天 · "+(ITEMS||[]).length+" 份";
  const openSet=new Set();
  $("#nav").querySelectorAll(".day").forEach(el=>{
    if(!el.classList.contains("collapsed"))openSet.add(el.dataset.d)});
  let h="";
  days.forEach(([d,arr],idx)=>{
    const isOpen=idx===0?true:openSet.has(d);
    h+='<div class="day'+(isOpen?"":" collapsed")+'" data-d="'+d+'">'
     +'<button class="day-h" type="button" onclick="toggleDay(this)">'
     +'<span class="cal"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></span>'
     +'<span class="d">'+d.slice(5)+'</span><span class="w">'+wk(d)+'</span>'
     +'<span class="n">'+arr.length+' 份</span><span class="cv"></span></button>'
     +'<div class="day-b">';
    arr.forEach(i=>{
      h+='<button type="button" class="item'+(i.f===CUR?" on":"")
       +'" data-f="'+i.f+'" onclick="openItem(this.dataset.f)">'
       +'<span class="chip">'+si(i.s,14)+'</span><span>'+esc(i.s)+'</span>'
       +'<span class="hm">'+slot(i.s).hm+'</span></button>';
    });
    h+='</div></div>';
  });
  $("#nav").innerHTML=h;
}
function refreshTabs(){
  const c=cur();if(!c){$("#tabs").innerHTML="";LASTDAY=null;return}
  if(LASTDAY!==c.d){
    LASTDAY=c.d;
    const arr=(byDate().find(x=>x[0]===c.d)||[])[1]||[];
    $("#tabs").innerHTML=arr.map(i=>
      '<button type="button" class="tab'+(i.f===CUR?" on":"")
      +'" onclick="openItem(this.dataset.f)" data-f="'+i.f+'">'
      +si(i.s,14)+'<span>'+esc(i.s)+'</span><span class="hm">'+slot(i.s).hm
      +'</span></button>').join("");
  }
}
function markActive(){
  $("#nav").querySelectorAll(".item").forEach(el=>
    el.classList.toggle("on",el.dataset.f===CUR));
  const tabs=$("#tabs");
  tabs.querySelectorAll(".tab").forEach(el=>
    el.classList.toggle("on",el.dataset.f===CUR));
  const on=tabs.querySelector(".tab.on");
  if(on&&on.scrollIntoView)on.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
}
function toggleDay(btn){btn.parentElement.classList.toggle("collapsed")}
function toggleSide(force){
  const s=$("#side"),sc=$("#scrim");
  const open=force===undefined?!s.classList.contains("open"):!!force;
  s.classList.toggle("open",open);sc.classList.toggle("show",open);
}
function doLock(){
  KEY=null;ITEMS=null;CUR=null;LASTDAY=null;
  forgetPw();                                    // 明确锁定 = 今天也要重新输
  VIEWS.forEach(v=>{v.classList.remove("on");v.srcdoc="";});
  showEmpty(false);
  $("#nav").innerHTML="";$("#tabs").innerHTML="";
  $("#app").classList.remove("show");$("#gate").classList.remove("hide");
  $("#dot").classList.remove("on");$("#pw").value="";
}
window.addEventListener("DOMContentLoaded",()=>{
  paintHero();
  const pw=savedPw();
  if(pw){$("#pw").value=pw;doUnlock();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")toggleSide(false)});
</script></body></html>
