<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0b0f16">
<title>交易报告</title>
<style>
:root{
  --bg:#0b0f16; --panel:#111722; --panel2:#151c28; --line:#222b39;
  --tx:#e8edf5; --tx2:#9aa7b8; --tx3:#65717f;
  --ac:#4c8dff; --ac-soft:rgba(76,141,255,.14); --ok:#31c48d;
  --up:#ff5c5c; --down:#31c48d;
  --r:12px; --sh:0 8px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);overflow:hidden;
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
  "Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#26303f;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#334052}
::-webkit-scrollbar-track{background:transparent}

/* ---------------- 解锁门 ---------------- */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:24px;z-index:60;
  background:radial-gradient(1200px 600px at 50% -10%,#152036 0%,var(--bg) 60%)}
.card{width:100%;max-width:376px;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:30px 26px;box-shadow:var(--sh)}
.mark{width:44px;height:44px;border-radius:13px;margin-bottom:16px;
  background:linear-gradient(140deg,var(--ac),#7b5cff);
  display:flex;align-items:center;justify-content:center}
.mark svg{width:23px;height:23px;stroke:#fff;stroke-width:2.1;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.card h1{margin:0 0 6px;font-size:19px;font-weight:600;letter-spacing:.2px}
.card p{margin:0 0 22px;font-size:12.5px;color:var(--tx2)}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;padding:11px 13px;border-radius:11px;
  border:1px solid var(--line);background:#0d131d;color:var(--tx);outline:none;
  transition:border-color .18s,box-shadow .18s}
.field input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.btn-primary{padding:11px 18px;border-radius:11px;background:var(--ac);color:#fff;
  font-weight:600;transition:background .18s,transform .1s}
.btn-primary:hover{background:#3d7de8}
.btn-primary:active{transform:scale(.97)}
.err{min-height:17px;margin-top:11px;font-size:12.5px;color:#ff7a70}
.hint{margin-top:14px;font-size:11.5px;color:var(--tx3);line-height:1.7}

/* ---------------- 主布局 ---------------- */
#app{display:flex;flex-direction:column;height:100%}
.main-col{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
.top{display:flex;align-items:center;gap:10px;height:54px;padding:0 14px;
  background:rgba(17,23,34,.9);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);z-index:20}
.icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;border:1px solid var(--line);background:var(--panel2);
  transition:background .15s}
.icon:hover{background:#1b2431}
.icon svg{width:16px;height:16px;stroke:var(--tx);stroke-width:2;fill:none;
  stroke-linecap:round}
.titles{min-width:0;flex:1}
.t1{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.t2{font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--tx3);transition:.3s;flex:0 0 7px}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(49,196,141,.16)}
.ghost{padding:7px 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);font-size:12.5px;transition:background .15s}
.ghost:hover{background:#1b2431}

/* 同日报告切换条 */
.tabs{display:flex;gap:7px;padding:10px 14px;overflow-x:auto;
  border-bottom:1px solid var(--line);background:var(--panel);
  scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 14px;border-radius:999px;font-size:12.5px;
  color:var(--tx2);border:1px solid var(--line);background:var(--panel2);
  white-space:nowrap;transition:.15s}
.tab:hover{color:var(--tx)}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.tab .hm{opacity:.6;margin-left:5px;font-size:11px}
.tab.on .hm{opacity:.85}

.stage{flex:1;min-height:0;display:flex;padding:0;background:#0e131c}
.stage iframe{flex:1;width:100%;border:0;background:#fff;display:block;border-radius:0}

/* ---------------- 目录（桌面侧栏 / 手机抽屉）---------------- */
#side{background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;z-index:40}
.side-h{display:flex;align-items:center;gap:8px;height:54px;padding:0 16px;
  border-bottom:1px solid var(--line);font-size:13px;font-weight:600;flex:0 0 auto}
.side-h .cnt{margin-left:auto;font-size:11.5px;color:var(--tx3);font-weight:400}
#nav{flex:1;overflow-y:auto;padding:10px 10px 24px}
.day{margin-bottom:6px}
.day-h{width:100%;display:flex;align-items:center;gap:8px;padding:9px 10px;
  border-radius:10px;color:var(--tx2);transition:background .15s}
.day-h:hover{background:var(--panel2)}
.day-h .d{font-size:12.5px;font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums}
.day-h .w{font-size:11px;color:var(--tx3)}
.day-h .n{margin-left:auto;font-size:11px;color:var(--tx3);
  background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.day-h .cv{width:9px;height:9px;border-right:1.8px solid var(--tx3);
  border-bottom:1.8px solid var(--tx3);transform:rotate(45deg);transition:transform .2s;
  margin-right:2px;margin-top:-3px}
.day.collapsed .day-h .cv{transform:rotate(-45deg);margin-top:2px}
.day-b{padding:2px 0 6px 8px;display:block}
.day.collapsed .day-b{display:none}
.item{width:100%;display:flex;align-items:center;gap:9px;padding:9px 11px;
  border-radius:9px;color:var(--tx2);font-size:12.8px;transition:.15s;text-align:left;
  border:1px solid transparent}
.item:hover{background:var(--panel2);color:var(--tx)}
.item.on{background:var(--ac-soft);border-color:rgba(76,141,255,.32);color:#d6e6ff;
  font-weight:600}
.item .bar{width:3px;height:14px;border-radius:2px;background:#2b3646;flex:0 0 3px}
.item.on .bar{background:var(--ac)}
.item .hm{margin-left:auto;font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}

#scrim{position:fixed;inset:0;background:rgba(4,7,12,.62);backdrop-filter:blur(2px);
  z-index:35;opacity:0;pointer-events:none;transition:opacity .22s}

/* ---------------- 手机端 ---------------- */
@media (max-width:899px){
  .stage{padding:0;background:#0b0f16}
  #side{position:fixed;left:0;right:0;bottom:0;max-height:76vh;
    border-radius:20px 20px 0 0;border-right:0;border-top:1px solid var(--line);
    transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
    box-shadow:0 -12px 40px rgba(0,0,0,.5);
    padding-bottom:env(safe-area-inset-bottom,0)}
  #side.open{transform:none}
  #scrim.show{opacity:1;pointer-events:auto}
  .side-h{border-radius:20px 20px 0 0}
  .side-h::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);
    width:38px;height:4px;border-radius:2px;background:#2c3646}
  .side-h{position:relative;height:56px;padding-top:10px}
  .item{padding:12px 12px}
}

/* ---------------- 桌面端 ---------------- */
@media (min-width:900px){
  #app{display:grid;grid-template-columns:296px 1fr;grid-template-rows:1fr;height:100%}
  #side{grid-row:1;grid-column:1}
  .main-col{grid-row:1;grid-column:2}
  .stage{padding:12px}
  .stage iframe{border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
  #scrim{display:none}
  #menuBtn{display:none}
}
</style></head><body>

<div id="gate">
  <form class="card" onsubmit="doUnlock();return false">
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/>
      <path d="M7 15l3.5-4 3 2.5L20 7"/></svg></div>
    <h1>交易报告</h1>
    <p>端到端加密 · 明文只在你的设备上解出</p>
    <div class="field">
      <input id="pw" type="password" placeholder="访问口令" autocomplete="current-password">
      <button class="btn-primary" type="submit">解锁</button>
    </div>
    <div class="err" id="err"></div>
    <div class="hint">服务器上只有密文，忘记口令无法找回。</div>
  </form>
</div>

<div id="app" style="display:none">
  <aside id="side">
    <div class="side-h">报告目录<span class="cnt" id="cnt"></span></div>
    <nav id="nav"></nav>
  </aside>

  <div class="main-col">
    <header class="top">
      <button class="icon" id="menuBtn" onclick="toggleSide()" aria-label="目录">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="titles">
        <div class="t1" id="curTitle">—</div>
        <div class="t2" id="curSub">—</div>
      </div>
      <span class="dot" id="dot"></span>
      <button class="ghost" onclick="doLock()">锁定</button>
    </header>
    <div class="tabs" id="tabs"></div>
    <div class="stage"><iframe id="view" sandbox="" referrerpolicy="no-referrer"></iframe></div>
  </div>
</div>

<div id="scrim" onclick="toggleSide(false)"></div>

<script>
const $=s=>document.querySelector(s);
const b64=d=>Uint8Array.from(atob(d),c=>c.charCodeAt(0));
const SLOT_TIME={"盘前一":"09:28","盘前":"09:28","盘前二":"09:45","盘中":"12:30","盘后":"20:00"};
const WEEK=["周日","周一","周二","周三","周四","周五","周六"];
let KEY=null,ITEMS=null,CUR=null;

function store(k,v){try{if(v===undefined)return sessionStorage.getItem(k);
  sessionStorage.setItem(k,v)}catch(e){}return null}
function wk(d){try{return WEEK[new Date(d+"T00:00:00").getDay()]}catch(e){return""}}
function hm(s){return SLOT_TIME[s]||""}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function deriveKey(pw,salt,iter){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),
    "PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function doUnlock(){
  const pw=$("#pw").value.trim();
  if(!pw)return;
  $("#err").textContent="";
  try{
    if(!ITEMS){
      const m=await (await fetch("data/manifest.json",{cache:"no-store"})).json();
      const k=await deriveKey(pw,b64(m.salt),m.iter);
      const pt=await crypto.subtle.decrypt(
        {name:"AES-GCM",iv:b64(m.iv),additionalData:new TextEncoder().encode("manifest")},
        k,b64(m.ct));
      ITEMS=JSON.parse(new TextDecoder().decode(pt)).items||[];
      KEY=k;
    }
    if(!ITEMS.length)throw new Error("empty");
    $("#gate").style.display="none";
    $("#app").style.display="";
    $("#dot").classList.add("on");
    await openItem(ITEMS[0].f);
    store("_p",pw);
  }catch(e){
    ITEMS=null;KEY=null;
    $("#err").textContent="口令错误，或报告尚未生成。";
  }
}
async function openItem(fid){
  if(!fid)return;
  const d=await (await fetch("data/"+fid+".json",{cache:"no-store"})).json();
  const pt=await crypto.subtle.decrypt(
    {name:"AES-GCM",iv:b64(d.iv),additionalData:new TextEncoder().encode(fid)},
    KEY,b64(d.ct));
  $("#view").srcdoc=new TextDecoder().decode(pt);
  CUR=fid;
  renderNav();renderTabs();renderHead();
  if(typeof toggleSide==="function")toggleSide(false);
}
function cur(){return (ITEMS||[]).find(i=>i.f===CUR)||null}
function renderHead(){
  const c=cur(); if(!c)return;
  $("#curTitle").textContent=c.s+"报告";
  $("#curSub").textContent=c.d+" "+wk(c.d)+(hm(c.s)?" · 生成 "+hm(c.s):"");
  document.title=(c.d+" "+c.s+" · 交易报告");
}
function byDate(){
  const m={};
  (ITEMS||[]).forEach(i=>{(m[i.d]=m[i.d]||[]).push(i)});
  const days=Object.keys(m).sort().reverse();
  days.forEach(d=>m[d].sort((a,b)=>(a.o||0)-(b.o||0)));
  return days.map(d=>[d,m[d]]);
}
function renderNav(){
  const days=byDate();
  $("#cnt").textContent=days.length+" 天 / "+(ITEMS||[]).length+" 份";
  const openSet=new Set();
  $("#nav").querySelectorAll(".day").forEach(el=>{
    if(!el.classList.contains("collapsed"))openSet.add(el.dataset.d)});
  let h="";
  days.forEach(([d,arr],idx)=>{
    const collapsed=idx>0&&openSet.size===0?"collapsed":(openSet.has(d)?"":"collapsed");
    const isOpen=idx===0?true:openSet.has(d);
    h+='<div class="day'+(isOpen?"":" collapsed")+'" data-d="'+d+'">'
     +'<button class="day-h" type="button" onclick="toggleDay(this)">'
     +'<span class="cv"></span>'
     +'<span class="d">'+d+'</span><span class="w">'+wk(d)+'</span>'
     +'<span class="n">'+arr.length+' 份</span></button><div class="day-b">';
    arr.forEach(i=>{
      h+='<button type="button" class="item'+(i.f===CUR?" on":"")
       +'" data-f="'+i.f+'" onclick="openItem(this.dataset.f)">'
       +'<span class="bar"></span><span>'+esc(i.s)+'</span>'
       +'<span class="hm">'+hm(i.s)+'</span></button>';
    });
    h+='</div></div>';
  });
  $("#nav").innerHTML=h;
}
function renderTabs(){
  const c=cur(); if(!c)return;
  const arr=(byDate().find(x=>x[0]===c.d)||[])[1]||[];
  $("#tabs").innerHTML=arr.map(i=>
    '<button type="button" class="tab'+(i.f===CUR?" on":"")
    +'" onclick="openItem(this.dataset.f)" data-f="'+i.f+'">'
    +esc(i.s)+'<span class="hm">'+hm(i.s)+'</span></button>').join("");
}
function toggleDay(btn){btn.parentElement.classList.toggle("collapsed")}
function toggleSide(force){
  const s=$("#side"),sc=$("#scrim");
  const open=force===undefined?!s.classList.contains("open"):!!force;
  s.classList.toggle("open",open);sc.classList.toggle("show",open);
}
function doLock(){
  KEY=null;ITEMS=null;CUR=null;store("_p",null);try{sessionStorage.removeItem("_p")}catch(e){}
  $("#view").srcdoc="";
  $("#app").style.display="none";$("#gate").style.display="";
  $("#dot").classList.remove("on");$("#pw").value="";
}
window.addEventListener("DOMContentLoaded",()=>{
  const pw=store("_p");
  if(pw){$("#pw").value=pw;doUnlock();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")toggleSide(false)});
</script></body></html>
