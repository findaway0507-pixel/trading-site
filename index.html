<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#1b1510">
<title>交易报告</title>
<style>
:root{
  --bg:#191310; --bg2:#211a14; --panel:#241c15; --panel2:#2d2319; --line:#3b2e22;
  --tx:#f6efe3; --tx2:#c9b8a3; --tx3:#93806c;
  --gold:#e9a23b; --gold2:#f3bd63; --soft:rgba(233,162,59,.16);
  --s1:#e9a23b; --s2:#e2803c; --s3:#d4584c; --s4:#b0709c;
  --up:#e5544b; --down:#3fae6b;
  --sh:0 10px 34px rgba(0,0,0,.42);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);overflow:hidden;
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
  "Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.si{width:15px;height:15px;fill:none;stroke-width:1.9;stroke-linecap:round;
  stroke-linejoin:round;flex:0 0 auto}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#3a2e23;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#4b3c2d}
::-webkit-scrollbar-track{background:transparent}

/* ---------------- 解锁页 ---------------- */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:24px;z-index:60;overflow:auto;
  background:
    radial-gradient(900px 460px at 12% -8%,rgba(233,162,59,.20),transparent 62%),
    radial-gradient(760px 420px at 92% 8%,rgba(212,88,76,.16),transparent 60%),
    linear-gradient(170deg,#221a13 0%,#191310 58%,#150f0c 100%)}
.card{width:100%;max-width:392px;background:linear-gradient(180deg,#2a2118,#221a13);
  border:1px solid var(--line);border-radius:20px;padding:26px 26px 24px;
  box-shadow:var(--sh);position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--s1),var(--s2),var(--s3),var(--s4))}
.hero{height:92px;margin:0 0 18px;border-radius:14px;
  background:linear-gradient(160deg,rgba(233,162,59,.13),rgba(176,112,156,.10));
  border:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;
  padding:12px 14px;gap:6px;overflow:hidden}
.hero i{display:block;width:6px;border-radius:3px;background:var(--gold);
  animation:pop .55s ease-out backwards}
@keyframes pop{from{transform:scaleY(.2);opacity:0}to{transform:scaleY(1);opacity:.9}}
.brandrow{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.mark{width:42px;height:42px;border-radius:13px;flex:0 0 42px;
  background:linear-gradient(140deg,var(--gold),#e07a3c);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(233,162,59,.28)}
.mark svg{width:22px;height:22px;stroke:#241a0e;stroke-width:2.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.card h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.2px}
.card .sub{margin:3px 0 0;font-size:12px;color:var(--tx3)}
.field{display:flex;gap:8px;margin-top:20px}
.field input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;
  border:1px solid var(--line);background:#1b1510;color:var(--tx);outline:none;
  transition:border-color .18s,box-shadow .18s}
.field input::placeholder{color:var(--tx3)}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--soft)}
.btn-primary{padding:12px 20px;border-radius:12px;
  background:linear-gradient(140deg,var(--gold),#dd8f34);color:#241a0e;
  font-weight:700;transition:filter .18s,transform .1s}
.btn-primary:hover{filter:brightness(1.07)}
.btn-primary:active{transform:scale(.97)}
.err{min-height:17px;margin-top:11px;font-size:12.5px;color:#ff8b7f}
.hint{margin-top:12px;font-size:11.5px;color:var(--tx3);line-height:1.75;
  display:flex;align-items:center;gap:6px}

/* ---------------- 主布局 ---------------- */
#app{display:flex;flex-direction:column;height:100%}
.main-col{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
.top{display:flex;align-items:center;gap:11px;height:56px;padding:0 14px;
  background:linear-gradient(180deg,rgba(45,35,25,.96),rgba(36,28,21,.96));
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:20}
.icon{width:35px;height:35px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;border:1px solid var(--line);background:var(--panel2);
  transition:background .15s}
.icon:hover{background:#382c20}
.icon svg{width:16px;height:16px;stroke:var(--tx);stroke-width:2;fill:none;
  stroke-linecap:round}
.titles{min-width:0;flex:1}
.t1{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
.t2{font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:1px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tx3);flex:0 0 8px;
  transition:.3s}
.dot.on{background:var(--down);box-shadow:0 0 0 3px rgba(63,174,107,.18)}
.ghost{padding:7px 13px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);font-size:12.5px;transition:background .15s;
  display:flex;align-items:center;gap:6px}
.ghost:hover{background:#382c20}

/* 同日报告切换条 */
.tabs{display:flex;gap:8px;padding:11px 14px;overflow-x:auto;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#241c15,#20180f);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 14px;
  border-radius:999px;font-size:12.5px;color:var(--tx2);border:1px solid var(--line);
  background:var(--panel2);white-space:nowrap;transition:.16s}
.tab:hover{color:var(--tx);border-color:#4b3c2d}
.tab .hm{font-size:10.5px;color:var(--tx3);font-variant-numeric:tabular-nums}
.tab.on{color:#241a0e;font-weight:700;border-color:transparent;
  background:linear-gradient(140deg,var(--gold),#e08e35);
  box-shadow:0 4px 14px rgba(233,162,59,.26)}
.tab.on .si{stroke:#241a0e !important}
.tab.on .hm{color:rgba(36,26,14,.7)}

.stage{flex:1;min-height:0;display:flex;padding:0;background:#171210}
.stage iframe{flex:1;width:100%;border:0;background:#fff;display:block;border-radius:0}

/* ---------------- 目录（桌面侧栏 / 手机抽屉）---------------- */
#side{background:linear-gradient(180deg,#241c15,#1e1712);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  min-height:0;z-index:40}
.side-h{display:flex;align-items:center;gap:8px;height:56px;padding:0 16px;
  border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex:0 0 auto;
  color:var(--gold2)}
.side-h .cnt{margin-left:auto;font-size:11px;color:var(--tx3);font-weight:400;
  background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:2px 8px}
#nav{flex:1;overflow-y:auto;padding:10px 10px 26px}
.day{margin-bottom:8px}
.day-h{width:100%;display:flex;align-items:center;gap:9px;padding:10px 11px;
  border-radius:11px;color:var(--tx2);transition:background .15s}
.day-h:hover{background:var(--panel2)}
.day-h .cal{width:26px;height:26px;border-radius:8px;flex:0 0 26px;
  background:var(--panel2);border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center}
.day-h .cal svg{width:14px;height:14px;stroke:var(--gold);stroke-width:1.9;fill:none}
.day-h .d{font-size:12.5px;font-weight:700;color:var(--tx);
  font-variant-numeric:tabular-nums}
.day-h .w{font-size:10.5px;color:var(--tx3)}
.day-h .n{margin-left:auto;font-size:10.5px;color:var(--tx3)}
.day-h .cv{width:8px;height:8px;border-right:1.8px solid var(--tx3);
  border-bottom:1.8px solid var(--tx3);transform:rotate(45deg);transition:transform .2s;
  margin-top:-3px}
.day.collapsed .day-h .cv{transform:rotate(-45deg);margin-top:2px}
.day-b{padding:1px 0 5px 10px;display:block}
.day.collapsed .day-b{display:none}
.item{width:100%;display:flex;align-items:center;gap:9px;padding:9px 11px;
  border-radius:10px;color:var(--tx2);font-size:12.8px;transition:.15s;
  text-align:left;border:1px solid transparent}
.item:hover{background:var(--panel2);color:var(--tx)}
.item .chip{width:24px;height:24px;border-radius:7px;flex:0 0 24px;
  display:flex;align-items:center;justify-content:center;background:#2d2319}
.item.on{background:var(--soft);border-color:rgba(233,162,59,.35);
  color:#ffe6bd;font-weight:700}
.item .hm{margin-left:auto;font-size:10.5px;color:var(--tx3);
  font-variant-numeric:tabular-nums}

#scrim{position:fixed;inset:0;background:rgba(12,8,5,.66);backdrop-filter:blur(2px);
  z-index:35;opacity:0;pointer-events:none;transition:opacity .22s}

/* ---------------- 手机端 ---------------- */
@media (max-width:899px){
  .stage{padding:0;background:#150f0c}
  #side{position:fixed;left:0;right:0;bottom:0;max-height:78vh;
    border-radius:22px 22px 0 0;border-right:0;border-top:1px solid var(--line);
    transform:translateY(101%);transition:transform .27s cubic-bezier(.32,.72,0,1);
    box-shadow:0 -14px 44px rgba(0,0,0,.55);
    padding-bottom:env(safe-area-inset-bottom,0)}
  #side.open{transform:none}
  #scrim.show{opacity:1;pointer-events:auto}
  .side-h{border-radius:22px 22px 0 0;position:relative;height:58px;padding-top:12px}
  .side-h::before{content:"";position:absolute;top:8px;left:50%;
    transform:translateX(-50%);width:40px;height:4px;border-radius:2px;background:#4b3c2d}
  .item{padding:12px 12px}
  .tab{padding:9px 15px}
}

/* ---------------- 桌面端 ---------------- */
@media (min-width:900px){
  #app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:1fr;height:100%}
  #side{grid-row:1;grid-column:1}
  .main-col{grid-row:1;grid-column:2}
  .stage{padding:12px}
  .stage iframe{border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  #scrim{display:none}
  #menuBtn{display:none}
}
</style></head><body>

<div id="gate">
  <form class="card" onsubmit="doUnlock();return false">
    <div class="hero" id="hero"></div>
    <div class="brandrow">
      <div class="mark"><svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/>
        <path d="M7.5 15l3.5-4 3 2.5L20.5 7"/></svg></div>
      <div>
        <h1>交易报告</h1>
        <p class="sub">端到端加密 · 明文只在你的设备上解出</p>
      </div>
    </div>
    <div class="field">
      <input id="pw" type="password" placeholder="访问口令" autocomplete="current-password">
      <button class="btn-primary" type="submit">解锁</button>
    </div>
    <div class="err" id="err"></div>
    <div class="hint"><svg class="si" viewBox="0 0 24 24" style="stroke:var(--tx3)">
      <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
      </svg>服务器上只有密文，忘记口令无法找回</div>
  </form>
</div>

<div id="app" style="display:none">
  <aside id="side">
    <div class="side-h"><svg class="si" viewBox="0 0 24 24" style="stroke:var(--gold)">
      <rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>
      </svg>报告目录<span class="cnt" id="cnt"></span></div>
    <nav id="nav"></nav>
  </aside>

  <div class="main-col">
    <header class="top">
      <button class="icon" id="menuBtn" onclick="toggleSide()" aria-label="目录">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="titles">
        <div class="t1" id="curTitle">—</div>
        <div class="t2" id="curSub">—</div>
      </div>
      <span class="dot" id="dot"></span>
      <button class="ghost" onclick="doLock()">
        <svg class="si" viewBox="0 0 24 24" style="stroke:var(--tx2)">
          <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>锁定</button>
    </header>
    <div class="tabs" id="tabs"></div>
    <div class="stage"><iframe id="view" sandbox="" referrerpolicy="no-referrer"></iframe></div>
  </div>
</div>

<div id="scrim" onclick="toggleSide(false)"></div>

<script>
const $=s=>document.querySelector(s);
const b64=d=>Uint8Array.from(atob(d),c=>c.charCodeAt(0));
const WEEK=["周日","周一","周二","周三","周四","周五","周六"];
const SUN="<path d='M12 3.5v2.6'/><path d='M4.9 9.9 3.3 8.3'/><path d='M2.5 17.5h19'/><path d='M5.8 13.8a6.6 6.6 0 0 1 12.4 0'/>";
const SLOTS={
  "盘前一":{"hm":"09:28","c":"var(--s1)","p":SUN},
  "盘前":{"hm":"09:28","c":"var(--s1)","p":SUN},
  "盘前二":{"hm":"09:45","c":"var(--s2)","p":"<circle cx='12' cy='12' r='4.1'/><path d='M12 2.4v2.4M12 19.2v2.4M4.4 12H2M22 12h-2.4M6 6l1.7 1.7M16.3 16.3 18 18M18 6l-1.7 1.7M7.7 16.3 6 18'/>"},
  "盘中":{"hm":"12:30","c":"var(--s3)","p":"<path d='M4 20V10M10 20V4M16 20v-7M22 20H2'/>"},
  "盘后":{"hm":"20:00","c":"var(--s4)","p":"<path d='M20.5 14.3A8.5 8.5 0 1 1 9.7 3.5a7 7 0 0 0 10.8 10.8z'/>"}
};
const DEFS={"hm":"","c":"var(--tx3)","p":"<path d='M5 4h11l3 3v13H5z'/><path d='M9 9h6M9 13h6'/>"};
function slot(s){return SLOTS[s]||DEFS}
function si(s,px){const d=slot(s);px=px||15;
  return '<svg class="si" viewBox="0 0 24 24" style="stroke:'+d.c+';width:'+px
    +'px;height:'+px+'px">'+d.p+'</svg>'}
let KEY=null,ITEMS=null,CUR=null;

function store(k,v){try{if(v===undefined)return sessionStorage.getItem(k);
  sessionStorage.setItem(k,v)}catch(e){}return null}
function wk(d){try{return WEEK[new Date(d+"T00:00:00").getDay()]}catch(e){return""}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function paintHero(){
  const el=$("#hero");if(!el)return;
  let h="",seed=11;
  for(let i=0;i<24;i++){
    seed=(seed*97+13)%100;
    const hh=16+seed*0.66, up=(i%3!==0);
    h+='<i style="height:'+hh.toFixed(0)+'px;background:'
      +(up?"var(--gold)":"rgba(63,174,107,.78)")
      +';animation-delay:'+(i*24)+'ms"></i>';
  }
  el.innerHTML=h;
}

async function deriveKey(pw,salt,iter){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),
    "PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function doUnlock(){
  const pw=$("#pw").value.trim();
  if(!pw)return;
  $("#err").textContent="";
  try{
    if(!ITEMS){
      const m=await (await fetch("data/manifest.json",{cache:"no-store"})).json();
      const k=await deriveKey(pw,b64(m.salt),m.iter);
      const pt=await crypto.subtle.decrypt(
        {name:"AES-GCM",iv:b64(m.iv),additionalData:new TextEncoder().encode("manifest")},
        k,b64(m.ct));
      ITEMS=JSON.parse(new TextDecoder().decode(pt)).items||[];
      KEY=k;
    }
    if(!ITEMS.length)throw new Error("empty");
    $("#gate").style.display="none";
    $("#app").style.display="";
    $("#dot").classList.add("on");
    await openItem(ITEMS[0].f);
    store("_p",pw);
  }catch(e){
    ITEMS=null;KEY=null;
    $("#err").textContent="口令错误，或报告尚未生成。";
  }
}
async function openItem(fid){
  if(!fid)return;
  const d=await (await fetch("data/"+fid+".json",{cache:"no-store"})).json();
  const pt=await crypto.subtle.decrypt(
    {name:"AES-GCM",iv:b64(d.iv),additionalData:new TextEncoder().encode(fid)},
    KEY,b64(d.ct));
  $("#view").srcdoc=new TextDecoder().decode(pt);
  CUR=fid;
  renderNav();renderTabs();renderHead();
  if(typeof toggleSide==="function")toggleSide(false);
}
function cur(){return (ITEMS||[]).find(i=>i.f===CUR)||null}
function renderHead(){
  const c=cur(); if(!c)return;
  $("#curTitle").innerHTML=si(c.s,16)+"<span>"+esc(c.s)+"报告</span>";
  const m=slot(c.s).hm;
  $("#curSub").textContent=c.d+" "+wk(c.d)+(m?" · 生成 "+m:"");
  document.title=(c.d+" "+c.s+" · 交易报告");
}
function byDate(){
  const m={};
  (ITEMS||[]).forEach(i=>{(m[i.d]=m[i.d]||[]).push(i)});
  const days=Object.keys(m).sort().reverse();
  days.forEach(d=>m[d].sort((a,b)=>(a.o||0)-(b.o||0)));
  return days.map(d=>[d,m[d]]);
}
function renderNav(){
  const days=byDate();
  $("#cnt").textContent=days.length+" 天 · "+(ITEMS||[]).length+" 份";
  const openSet=new Set();
  $("#nav").querySelectorAll(".day").forEach(el=>{
    if(!el.classList.contains("collapsed"))openSet.add(el.dataset.d)});
  let h="";
  days.forEach(([d,arr],idx)=>{
    const isOpen=idx===0?true:openSet.has(d);
    h+='<div class="day'+(isOpen?"":" collapsed")+'" data-d="'+d+'">'
     +'<button class="day-h" type="button" onclick="toggleDay(this)">'
     +'<span class="cal"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></span>'
     +'<span class="d">'+d.slice(5)+'</span><span class="w">'+wk(d)+'</span>'
     +'<span class="n">'+arr.length+' 份</span><span class="cv"></span></button>'
     +'<div class="day-b">';
    arr.forEach(i=>{
      h+='<button type="button" class="item'+(i.f===CUR?" on":"")
       +'" data-f="'+i.f+'" onclick="openItem(this.dataset.f)">'
       +'<span class="chip">'+si(i.s,14)+'</span><span>'+esc(i.s)+'</span>'
       +'<span class="hm">'+slot(i.s).hm+'</span></button>';
    });
    h+='</div></div>';
  });
  $("#nav").innerHTML=h;
}
function renderTabs(){
  const c=cur(); if(!c)return;
  const arr=(byDate().find(x=>x[0]===c.d)||[])[1]||[];
  $("#tabs").innerHTML=arr.map(i=>
    '<button type="button" class="tab'+(i.f===CUR?" on":"")
    +'" onclick="openItem(this.dataset.f)" data-f="'+i.f+'">'
    +si(i.s,14)+'<span>'+esc(i.s)+'</span><span class="hm">'+slot(i.s).hm
    +'</span></button>').join("");
}
function toggleDay(btn){btn.parentElement.classList.toggle("collapsed")}
function toggleSide(force){
  const s=$("#side"),sc=$("#scrim");
  const open=force===undefined?!s.classList.contains("open"):!!force;
  s.classList.toggle("open",open);sc.classList.toggle("show",open);
}
function doLock(){
  KEY=null;ITEMS=null;CUR=null;store("_p",null);
  try{sessionStorage.removeItem("_p")}catch(e){}
  $("#view").srcdoc="";
  $("#app").style.display="none";$("#gate").style.display="";
  $("#dot").classList.remove("on");$("#pw").value="";
}
window.addEventListener("DOMContentLoaded",()=>{
  paintHero();
  const pw=store("_p");
  if(pw){$("#pw").value=pw;doUnlock();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")toggleSide(false)});
</script></body></html>
